<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WUTONG — Automotive HMI</title>
<meta name="description" content="WUTONG — automotive HMI. A pure-visual homepage with a live instrument cluster drawn in code.">
<style>
  :root{
    --bg:#05070c; --ink:#eef1f5; --faint:#8b98a9; --line:rgba(255,255,255,.09);
    --accent:#f5b544; --accent2:#4da3ff; --mode:#f5b544;
    --mx:50%; --my:38%;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent); color:#0a0c10}

  /* ambient background */
  .aurora{position:fixed; inset:-20%; z-index:0; pointer-events:none; filter:blur(70px) saturate(1.25); opacity:.85}
  .aurora i{position:absolute; border-radius:50%; mix-blend-mode:screen}
  .aurora i:nth-child(1){width:55vmax;height:55vmax;left:-8%;top:-14%;background:radial-gradient(circle at 35% 35%, rgba(245,181,68,.34), transparent 62%);animation:drift1 26s ease-in-out infinite alternate}
  .aurora i:nth-child(2){width:48vmax;height:48vmax;right:-10%;top:6%;background:radial-gradient(circle at 60% 40%, rgba(77,163,255,.30), transparent 62%);animation:drift2 32s ease-in-out infinite alternate}
  .aurora i:nth-child(3){width:40vmax;height:40vmax;left:26%;bottom:-20%;background:radial-gradient(circle at 50% 50%, rgba(255,92,92,.16), transparent 60%);animation:drift1 38s ease-in-out infinite alternate-reverse}
  @keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(7vmax,4vmax) scale(1.14)}}
  @keyframes drift2{from{transform:translate(0,0) scale(1.08)}to{transform:translate(-6vmax,6vmax) scale(.96)}}
  .spot{position:fixed; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(560px circle at var(--mx) var(--my), rgba(255,255,255,.075), transparent 65%)}
  .grain{position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.5;
    background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px); background-size:26px 26px;
    mask-image:radial-gradient(ellipse 90% 80% at 50% 40%, #000 30%, transparent 78%)}

  /* giant watermark */
  .watermark{position:fixed; inset:0; z-index:0; display:flex; align-items:center; justify-content:center; pointer-events:none; overflow:hidden}
  .watermark span{font-size:44vw; font-weight:900; letter-spacing:-.02em; line-height:1; color:transparent;
    -webkit-text-stroke:1px rgba(255,255,255,.05); transform:translateY(4vh); user-select:none}

  /* frame */
  .frame{position:fixed; inset:14px; z-index:3; pointer-events:none; border:1px solid rgba(255,255,255,.07); border-radius:18px}
  .hud{position:fixed; top:0; left:0; right:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:26px 34px}
  .hud .mark{font-weight:900; letter-spacing:.34em; font-size:13px}
  .hud .mark b{color:var(--accent)}
  .hud .clock{font-size:11px; letter-spacing:.26em; color:var(--faint); font-variant-numeric:tabular-nums}
  .corner{position:fixed; bottom:0; z-index:5; display:flex; gap:10px; padding:26px 34px}
  .corner.left{left:0} .corner.right{right:0}
  .corner a{pointer-events:auto; color:var(--faint); text-decoration:none; font-size:11px; letter-spacing:.22em;
    border:1px solid var(--line); border-radius:999px; padding:8px 14px; background:rgba(255,255,255,.03); backdrop-filter:blur(8px); transition:.25s}
  .corner a:hover{color:var(--ink); border-color:rgba(255,255,255,.35); transform:translateY(-2px)}

  /* stage */
  .stage{position:relative; z-index:2; min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:96px 20px 110px; text-align:center}
  .name{
    font-size:clamp(76px, 15.5vw, 218px); font-weight:900; line-height:.94; letter-spacing:-.015em;
    background:linear-gradient(100deg, #fff 10%, #ffd88a 32%, var(--accent2) 55%, #fff 78%);
    background-size:220% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    animation:sheen 7s ease-in-out infinite; filter:drop-shadow(0 18px 55px rgba(245,181,68,.16));
  }
  @keyframes sheen{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  .tag{margin-top:14px; font-size:clamp(11px, 1.6vw, 15px); letter-spacing:.62em; text-indent:.62em; color:var(--faint); font-weight:600}
  .tag b{color:var(--mode); transition:.4s}

  /* gauge */
  .gauge-card{position:relative; margin-top:clamp(22px, 4vh, 44px); width:min(600px, 94vw);
    border:1px solid var(--line); border-radius:28px; padding:20px 18px 16px;
    background:linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    backdrop-filter:blur(14px); box-shadow:0 34px 90px rgba(0,0,0,.55), 0 0 90px -18px var(--mode); transition:box-shadow .5s}
  .gauge-card::before{content:""; position:absolute; inset:0 0 auto 0; height:1px; border-radius:28px;
    background:linear-gradient(90deg, transparent, var(--mode), transparent); opacity:.9; transition:.4s}
  #gauge{display:block; width:100%; height:auto}
  .modes{display:flex; gap:8px; justify-content:center; margin-top:6px}
  .modes button{appearance:none; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--faint);
    font:600 11px/1 "Segoe UI", sans-serif; letter-spacing:.24em; text-indent:.24em; padding:10px 18px 10px; border-radius:999px; cursor:pointer; transition:.25s}
  .modes button:hover{color:var(--ink); border-color:rgba(255,255,255,.35)}
  .modes button.on{color:#0a0c10; background:var(--mode); border-color:transparent; box-shadow:0 6px 26px -6px var(--mode)}
  .demo{display:inline-block; margin-top:clamp(20px, 3.4vh, 34px); text-decoration:none; color:var(--ink);
    font-weight:800; letter-spacing:.3em; text-indent:.3em; font-size:13px; padding:16px 30px; border-radius:999px;
    border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.04); backdrop-filter:blur(8px); transition:.25s}
  .demo:hover{transform:translateY(-3px) scale(1.02); border-color:var(--mode); box-shadow:0 16px 44px -12px var(--mode)}
  .demo span{color:var(--mode); transition:.4s}

  /* marquee */
  .marquee{position:fixed; left:0; right:0; bottom:52px; z-index:1; overflow:hidden; pointer-events:none;
    mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent)}
  .marquee .track{display:flex; width:max-content; animation:scroll 30s linear infinite}
  .marquee span{font-size:clamp(26px, 4.4vw, 54px); font-weight:900; letter-spacing:.06em; white-space:nowrap; padding-right:.6em;
    color:transparent; -webkit-text-stroke:1px rgba(255,255,255,.13)}
  .marquee span i{font-style:normal; -webkit-text-stroke:0; color:var(--mode); opacity:.55; padding-left:.6em; transition:.4s}
  @keyframes scroll{to{transform:translateX(-50%)}}

  @media (max-width:640px){
    .frame{inset:8px; border-radius:14px}
    .hud{padding:18px 20px}
    .corner{padding:18px 20px}
    .stage{padding:84px 14px 120px}
    .gauge-card{border-radius:22px; padding:14px 10px 12px}
    .modes button{padding:9px 13px 9px; letter-spacing:.16em; text-indent:.16em}
    .marquee{bottom:64px}
  }
  @media (max-width:380px){
    .hud .clock{display:none}
    .tag{letter-spacing:.4em; text-indent:.4em}
    .corner a{padding:7px 11px; letter-spacing:.14em}
  }
  @media (prefers-reduced-motion: reduce){
    .aurora i, .name, .marquee .track{animation:none}
  }
</style>
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <div class="watermark"><span>HMI</span></div>
  <div class="spot"></div>
  <div class="grain"></div>
  <div class="frame"></div>

  <header class="hud">
    <div class="mark">WUTONG<b>.</b></div>
    <div class="clock" id="clock">NANJING --:--:--</div>
  </header>

  <main class="stage">
    <h1 class="name">WUTONG</h1>
    <div class="tag">AUTOMOTIVE <b>HMI</b></div>

    <div class="gauge-card" aria-label="Interactive instrument cluster">
      <canvas id="gauge" width="640" height="440"></canvas>
      <div class="modes">
        <button data-mode="eco">ECO</button>
        <button data-mode="comfort" class="on">COMFORT</button>
        <button data-mode="sport">SPORT</button>
      </div>
    </div>

    <a class="demo" href="/wutong/">FULL DEMO <span>→</span></a>
  </main>

  <div class="marquee"><div class="track" id="marquee"></div></div>

  <div class="corner left"><a href="https://github.com/wutongworks">GITHUB ↗</a></div>
  <div class="corner right"><a href="mailto:leon.wutong@gmail.com">EMAIL ↗</a></div>

<script>
  // Nanjing clock
  const clockEl = document.getElementById('clock');
  const fmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Shanghai', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const tickClock = () => { clockEl.textContent = 'NANJING ' + fmt.format(new Date()); };
  tickClock(); setInterval(tickClock, 1000);

  // cursor spotlight
  const root = document.documentElement;
  addEventListener('pointermove', e => {
    root.style.setProperty('--mx', (e.clientX / innerWidth * 100) + '%');
    root.style.setProperty('--my', (e.clientY / innerHeight * 100) + '%');
  }, { passive: true });

  // marquee — pure typography
  const seq = '<span>WUTONG<i>·</i></span><span>HMI<i>·</i></span><span>CLUSTER<i>·</i></span><span>COCKPIT<i>·</i></span>';
  document.getElementById('marquee').innerHTML = seq + seq + seq + seq;

  // live gauge
  const cv = document.getElementById('gauge'), ctx = cv.getContext('2d');
  const MODES = {
    eco:     { name: 'ECO',     color: '#4ade80', max: 180, target: 62 },
    comfort: { name: 'COMFORT', color: '#f5b544', max: 240, target: 96 },
    sport:   { name: 'SPORT',   color: '#ff5c5c', max: 300, target: 168 }
  };
  let mode = MODES.comfort, speed = 0, t = 0;
  document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.modes button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    mode = MODES[b.dataset.mode];
    root.style.setProperty('--mode', mode.color);
  }));
  root.style.setProperty('--mode', mode.color);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw() {
    const W = cv.width, H = cv.height, cx = W / 2, cy = H / 2 + 30, R = 205;
    const a0 = Math.PI * 0.78, a1 = Math.PI * 2.22;
    t += 0.016;
    const target = mode.target + Math.sin(t * 0.9) * mode.target * 0.14;
    speed += (target - speed) * 0.045;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, R, a0, a1); ctx.strokeStyle = 'rgba(255,255,255,.09)'; ctx.lineWidth = 15; ctx.stroke();
    const frac = Math.max(0, Math.min(1, speed / mode.max));
    ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + (a1 - a0) * frac); ctx.strokeStyle = mode.color; ctx.lineWidth = 15;
    ctx.shadowColor = mode.color; ctx.shadowBlur = 22; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.fillStyle = '#9aa7b5'; ctx.font = '600 15px "Segoe UI", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i <= 10; i++) {
      const a = a0 + (a1 - a0) * i / 10, big = i % 2 === 0;
      const r1 = R - 26, r2 = R - (big ? 48 : 38);
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      ctx.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      ctx.strokeStyle = big ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.25)'; ctx.lineWidth = big ? 3 : 2; ctx.stroke();
      if (big) ctx.fillText(String(Math.round(mode.max * i / 10)), cx + Math.cos(a) * (R - 76), cy + Math.sin(a) * (R - 76));
    }
    const na = a0 + (a1 - a0) * frac;
    ctx.beginPath(); ctx.moveTo(cx - Math.cos(na) * 22, cy - Math.sin(na) * 22);
    ctx.lineTo(cx + Math.cos(na) * (R - 58), cy + Math.sin(na) * (R - 58));
    ctx.strokeStyle = '#eef1f5'; ctx.lineWidth = 5; ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 13, 0, Math.PI * 2); ctx.fillStyle = '#14171d'; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = mode.color; ctx.stroke();
    ctx.fillStyle = '#eef1f5'; ctx.font = '800 66px "Segoe UI", sans-serif';
    ctx.fillText(String(Math.round(speed)), cx, cy + 74);
    ctx.fillStyle = '#6b7889'; ctx.font = '600 13px "Segoe UI", sans-serif';
    ctx.fillText('km/h', cx, cy + 110);
    if (!reduce) requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
