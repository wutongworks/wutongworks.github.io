<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✦</title>
<meta name="description" content="Deep space. A living starfield, nebulae and a black hole, drawn in code.">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#01020a; overflow:hidden; font-family:"Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased}
  ::selection{background:#7c5cff; color:#fff}

  #space{position:fixed; inset:0; display:block}

  /* nebula wash above canvas stars, below ui */
  .nebula{position:fixed; inset:-15%; pointer-events:none; filter:blur(60px) saturate(1.3); opacity:.8; mix-blend-mode:screen}
  .nebula i{position:absolute; border-radius:50%}
  .nebula i:nth-child(1){width:52vmax;height:52vmax;left:-6%;top:-12%;background:radial-gradient(circle at 40% 40%, rgba(109,40,217,.34), transparent 62%);animation:drift1 30s ease-in-out infinite alternate}
  .nebula i:nth-child(2){width:44vmax;height:44vmax;right:-8%;top:16%;background:radial-gradient(circle at 55% 45%, rgba(37,99,235,.28), transparent 62%);animation:drift2 36s ease-in-out infinite alternate}
  .nebula i:nth-child(3){width:36vmax;height:36vmax;left:30%;bottom:-18%;background:radial-gradient(circle at 50% 50%, rgba(13,148,136,.20), transparent 60%);animation:drift1 42s ease-in-out infinite alternate-reverse}
  .nebula i:nth-child(4){width:26vmax;height:26vmax;right:22%;bottom:-6%;background:radial-gradient(circle at 50% 50%, rgba(219,39,119,.14), transparent 60%);animation:drift2 27s ease-in-out infinite alternate-reverse}
  @keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,4vmax) scale(1.15)}}
  @keyframes drift2{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-5vmax,5vmax) scale(.95)}}

  .vignette{position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 105% 90% at 50% 46%, transparent 55%, rgba(0,0,5,.55) 100%)}

  /* minimal ui */
  .ui{position:fixed; z-index:5; color:rgba(226,232,255,.62); text-decoration:none;
    font-size:10px; letter-spacing:.3em; text-indent:.3em; padding:10px 16px; border-radius:999px;
    border:1px solid rgba(160,170,255,.16); background:rgba(10,12,30,.28); backdrop-filter:blur(8px);
    transition:.3s; opacity:.55}
  .ui:hover{opacity:1; color:#fff; border-color:rgba(190,200,255,.5); transform:translateY(-2px); box-shadow:0 10px 34px -10px rgba(124,92,255,.65)}
  .ui.gh{left:22px; bottom:22px}
  .ui.mail{right:22px; bottom:22px}
  .ui.enter{left:50%; bottom:26px; transform:translateX(-50%); font-size:11px; padding:13px 24px; opacity:.75}
  .ui.enter:hover{transform:translateX(-50%) translateY(-2px)}
  .ui.enter b{color:#a78bfa; font-weight:800}

  @media (max-width:640px){
    .ui.gh{left:14px; bottom:16px} .ui.mail{right:14px; bottom:16px}
    .ui.enter{bottom:64px}
  }
  @media (prefers-reduced-motion: reduce){
    .nebula i{animation:none}
  }
</style>
</head>
<body>
  <canvas id="space"></canvas>
  <div class="nebula"><i></i><i></i><i></i><i></i></div>
  <div class="vignette"></div>

  <a class="ui gh" href="https://github.com/wutongworks">GITHUB ↗</a>
  <a class="ui enter" href="/wutong/">ENTER <b>→</b></a>
  <a class="ui mail" href="mailto:leon.wutong@gmail.com">EMAIL ↗</a>

<script>
  const cv = document.getElementById('space'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = 1, CX = 0, CY = 0, R = 0;
  let mx = 0, my = 0, tx = 0, ty = 0;

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H * 0.46;
    R = Math.min(W, H) * 0.16;
    buildStars();
  }

  // ---- starfield: 3 depth layers + warp drift ----
  let stars = [];
  function buildStars() {
    stars = [];
    const n = Math.min(900, Math.floor(W * H / 1600));
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        z: 0.25 + Math.random() * 0.75,          // depth
        r: Math.random() * 1.4 + 0.2,
        tw: Math.random() * Math.PI * 2,          // twinkle phase
        hue: Math.random() < 0.12 ? (200 + Math.random() * 60) : (Math.random() < 0.08 ? 35 : 0)
      });
    }
  }

  // ---- accretion disk particles ----
  const disk = [];
  for (let i = 0; i < 700; i++) {
    const a = Math.random() * Math.PI * 2;
    const rad = 1.25 + Math.pow(Math.random(), 1.6) * 1.9;   // in units of R
    disk.push({ a, rad, sp: (0.55 / Math.pow(rad, 1.5)) * (0.7 + Math.random() * 0.6), s: Math.random() * 1.8 + 0.4,
      warm: Math.random() });
  }

  // ---- shooting stars ----
  let meteors = [];
  function spawnMeteor() {
    meteors.push({ x: Math.random() * W * 0.7 + W * 0.2, y: Math.random() * H * 0.3, vx: -(6 + Math.random() * 5), vy: 3.4 + Math.random() * 2.4, life: 1 });
  }

  addEventListener('pointermove', e => { tx = (e.clientX / W - 0.5); ty = (e.clientY / H - 0.5); }, { passive: true });
  addEventListener('resize', resize);
  resize();

  let t = 0;
  function frame() {
    t += 0.016;
    mx += (tx - mx) * 0.03; my += (ty - my) * 0.03;
    const px = mx * 18, py = my * 12;

    // deep space base with subtle radial lift at centre
    ctx.clearRect(0, 0, W, H);
    const base = ctx.createRadialGradient(CX + px * 0.4, CY + py * 0.4, 0, CX, CY, Math.max(W, H) * 0.75);
    base.addColorStop(0, '#070a24'); base.addColorStop(0.45, '#03040f'); base.addColorStop(1, '#01020a');
    ctx.fillStyle = base; ctx.fillRect(0, 0, W, H);

    // stars
    for (const s of stars) {
      s.y += s.z * 0.14; s.x += s.z * 0.05;
      if (s.y > H + 2) { s.y = -2; s.x = Math.random() * W; }
      if (s.x > W + 2) { s.x = -2; }
      const tw = 0.55 + 0.45 * Math.sin(t * (1 + s.z * 2) + s.tw);
      const a = tw * (0.35 + s.z * 0.65);
      ctx.beginPath();
      ctx.arc(s.x + px * s.z, s.y + py * s.z, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.hue ? `hsla(${s.hue}, 90%, 78%, ${a})` : `rgba(235,240,255,${a})`;
      if (s.z > 0.85 && s.r > 1.1) { ctx.shadowColor = 'rgba(200,210,255,.9)'; ctx.shadowBlur = 8; } else ctx.shadowBlur = 0;
      ctx.fill(); ctx.shadowBlur = 0;
    }

    // meteors
    if (Math.random() < 0.006 && meteors.length < 2) spawnMeteor();
    meteors = meteors.filter(m => m.life > 0);
    for (const m of meteors) {
      m.x += m.vx; m.y += m.vy; m.life -= 0.012;
      const grad = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 9, m.y - m.vy * 9);
      grad.addColorStop(0, `rgba(255,255,255,${0.85 * m.life})`); grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 9, m.y - m.vy * 9); ctx.stroke();
    }

    const cx = CX + px, cy = CY + py;

    // ---- black hole ----
    // outer glow
    let g = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R * 3.6);
    g.addColorStop(0, 'rgba(150,110,255,.20)'); g.addColorStop(0.4, 'rgba(90,70,220,.10)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(cx - R * 3.6, cy - R * 3.6, R * 7.2, R * 7.2);

    // disk back half
    drawDisk(cx, cy, Math.PI, Math.PI * 2);
    // photon ring + event horizon
    ctx.beginPath(); ctx.arc(cx, cy, R * 1.06, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,214,150,.85)'; ctx.lineWidth = 2.4;
    ctx.shadowColor = 'rgba(255,180,90,.95)'; ctx.shadowBlur = 26; ctx.stroke(); ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
    const hole = ctx.createRadialGradient(cx, cy, R * 0.2, cx, cy, R);
    hole.addColorStop(0, '#000'); hole.addColorStop(0.85, '#000'); hole.addColorStop(1, 'rgba(0,0,0,.92)');
    ctx.fillStyle = hole; ctx.fill();
    // disk front half (passes in front of the hole)
    drawDisk(cx, cy, 0, Math.PI);

    function drawDisk(cx, cy, a0, a1) {
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(1, 0.36); ctx.translate(-cx, -cy);
      // disk band glow
      ctx.beginPath(); ctx.arc(cx, cy, R * 2.15, a0, a1);
      ctx.strokeStyle = 'rgba(255,170,80,.13)'; ctx.lineWidth = R * 0.85;
      ctx.shadowColor = 'rgba(255,150,60,.55)'; ctx.shadowBlur = 34; ctx.stroke(); ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(cx, cy, R * 1.62, a0, a1);
      ctx.strokeStyle = 'rgba(255,205,130,.20)'; ctx.lineWidth = R * 0.4; ctx.stroke();
      // particles
      for (const p of disk) {
        if (p.a < a0 || p.a > a1) continue;
        const x = cx + Math.cos(p.a) * R * p.rad, y = cy + Math.sin(p.a) * R * p.rad;
        const hot = p.warm;
        ctx.beginPath(); ctx.arc(x, y, p.s * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = hot > 0.75 ? 'rgba(255,226,170,.95)' : hot > 0.4 ? 'rgba(255,178,102,.8)' : 'rgba(196,150,255,.65)';
        ctx.fill();
      }
      ctx.restore();
      // advance particles (only once per frame, during back pass)
      if (a0 === Math.PI) for (const p of disk) { p.a += p.sp * 0.016; if (p.a > Math.PI * 2) p.a -= Math.PI * 2; }
    }

    if (!reduce) requestAnimationFrame(frame);
  }
  frame();
</script>
</body>
</html>
