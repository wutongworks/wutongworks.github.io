<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>✦</title>
<meta name="description" content="A river of light. Your hand is the wind.">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#01030c; overflow:hidden; font-family:"Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing:antialiased; touch-action:none; cursor:crosshair}
  ::selection{background:#0ea5e9; color:#fff}
  #space{position:fixed; inset:0; display:block}
  .vignette{position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse 110% 95% at 50% 46%, transparent 55%, rgba(0,0,5,.55) 100%)}
  .ui{position:fixed; z-index:5; left:50%; bottom:26px; transform:translateX(-50%);
    color:rgba(224,242,254,.8); font-size:11px; letter-spacing:.34em; text-indent:.34em;
    padding:13px 26px; border-radius:999px; border:1px solid rgba(147,197,253,.22);
    background:rgba(2,8,23,.34); backdrop-filter:blur(10px); cursor:pointer; transition:.3s; font-family:inherit}
  .ui:hover{color:#fff; border-color:rgba(186,230,253,.6); transform:translateX(-50%) translateY(-2px);
    box-shadow:0 10px 34px -10px rgba(14,165,233,.65)}
  .ui b{color:#7dd3fc; font-weight:800}
  .hint{position:fixed; z-index:5; left:50%; bottom:76px; transform:translateX(-50%);
    color:rgba(186,220,253,.45); font-size:10px; letter-spacing:.4em; text-indent:.4em; white-space:nowrap;
    pointer-events:none; transition:opacity 1.2s}
  @media (max-width:640px){ .ui{bottom:20px} .hint{bottom:68px; letter-spacing:.22em; text-indent:.22em} }
</style>
</head>
<body>
  <canvas id="space"></canvas>
  <div class="vignette"></div>
  <div class="hint" id="hint">DRAG · HOLD · DOUBLE-TAP</div>
  <button class="ui" id="surgeBtn">ENTER <b>✦</b></button>

<script>
  const cv = document.getElementById('space'), ctx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W = 0, H = 0, DPR = 1;

  let t = 0, lastAct = performance.now();
  let surge = 0, surgeOn = false;               // ENTER surge state 0..1
  let bloom = null;                              // hold-to-gather nebula {x,y,power}
  const ptr = { x: -9999, y: -9999, vx: 0, vy: 0, down: false, downT: 0, lastX: 0, lastY: 0, moved: 0 };

  // film grain tile
  const grain = document.createElement('canvas'); grain.width = grain.height = 140;
  (function paintGrain() {
    const c = grain.getContext('2d'), img = c.createImageData(140, 140);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = Math.random() * 255 | 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    c.putImageData(img, 0, 0);
  })();

  // ---------- the flow field ----------
  function fieldAngle(x, y) {
    return (Math.sin(x * 0.0021 + t * 0.12) + Math.cos(y * 0.0018 - t * 0.09) + Math.sin((x + y) * 0.00105 + t * 0.06)) * 1.12 + 0.35;
  }
  function baseHue() { return 192 + 78 * (0.5 + 0.5 * Math.sin(t * 0.011)); }  // teal <-> violet, minutes-scale

  // ---------- particles ----------
  let parts = [];
  function spawn(p) {
    p.x = Math.random() * W; p.y = Math.random() * H;
    p.px = p.x; p.py = p.y;
    p.life = 0; p.maxLife = 260 + Math.random() * 420;
    p.speed = 0.55 + Math.random() * 0.95;
    p.hueJit = (Math.random() - 0.5) * 46;
    p.w = Math.random() * 1.5 + 0.5;
    return p;
  }
  function buildParts() {
    parts = [];
    const n = Math.min(1500, Math.floor(W * H / 1250));
    for (let i = 0; i < n; i++) { const p = spawn({}); p.life = Math.random() * p.maxLife; parts.push(p); }
  }
  let sparks = [];   // burst debris, fast + short-lived
  function spawnSparks(x, y, power, hue) {
    const n = Math.floor(60 * power);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = (Math.random() * 5.5 + 1) * power;
      sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: 0.012 + Math.random() * 0.02, hue: hue + (Math.random() - 0.5) * 40 });
    }
  }

  // ---------- lantern orbs ----------
  let orbs = [];
  function addOrb(x, y) {
    orbs.push({ x, y, vx: 0, vy: 0, life: 1, hue: baseHue() + (Math.random() - 0.5) * 60 });
    if (orbs.length > 3) orbs.shift();
  }

  // ---------- interaction ----------
  addEventListener('pointermove', e => {
    ptr.vx = ptr.vx * 0.55 + (e.clientX - ptr.lastX) * 0.45;
    ptr.vy = ptr.vy * 0.55 + (e.clientY - ptr.lastY) * 0.45;
    if (ptr.down) ptr.moved += Math.abs(e.clientX - ptr.lastX) + Math.abs(e.clientY - ptr.lastY);
    ptr.lastX = e.clientX; ptr.lastY = e.clientY;
    ptr.x = e.clientX; ptr.y = e.clientY;
    if (bloom) { bloom.x = e.clientX; bloom.y = e.clientY; }
    lastAct = performance.now();
  }, { passive: true });
  addEventListener('pointerdown', e => {
    if (e.target.closest('.ui')) return;
    ptr.down = true; ptr.downT = performance.now(); ptr.moved = 0;
    ptr.lastX = ptr.x = e.clientX; ptr.lastY = ptr.y = e.clientY;
    lastAct = performance.now();
  });
  addEventListener('pointerup', e => {
    if (!ptr.down) return;
    ptr.down = false;
    lastAct = performance.now();
    if (bloom) {
      const hue = baseHue();
      spawnSparks(bloom.x, bloom.y, 0.7 + bloom.power * 1.6, hue);
      for (const p of parts) {
        const dx = p.x - bloom.x, dy = p.y - bloom.y, d = Math.hypot(dx, dy);
        if (d < 320 && d > 1) { const f = (1 - d / 320) * (4 + 9 * bloom.power); p.x += dx / d * f * 2.2; p.y += dy / d * f * 2.2; p.px = p.x - dx / d * f; p.py = p.y - dy / d * f; }
      }
      if (bloom.power > 0.55 && navigator.vibrate) { try { navigator.vibrate(12); } catch (err) {} }
      bloom = null; return;
    }
    if (e.target.closest('.ui')) return;
    if (performance.now() - ptr.downT < 240 && ptr.moved < 12) spawnSparks(e.clientX, e.clientY, 0.55, baseHue());
  });
  addEventListener('dblclick', e => {
    if (e.target.closest('.ui')) return;
    addOrb(e.clientX, e.clientY);
    lastAct = performance.now();
  });
  document.getElementById('surgeBtn').addEventListener('click', () => { surgeOn = true; lastAct = performance.now(); });
  // rotating play hints
  const hintEl = document.getElementById('hint');
  const hints = ['DRAG · HOLD · DOUBLE-TAP', 'YOUR HAND IS THE WIND', 'HOLD TO GATHER A NEBULA', 'DOUBLE-TAP TO RELEASE A LANTERN', 'PRESS ENTER FOR THE SURGE'];
  let hintIdx = 0;
  setInterval(() => {
    hintEl.style.opacity = '0';
    setTimeout(() => { hintIdx = (hintIdx + 1) % hints.length; hintEl.textContent = hints[hintIdx]; hintEl.style.opacity = '0.5'; }, 1200);
  }, 7000);
  setTimeout(() => { hintEl.style.opacity = '0.5'; }, 400);

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#01030c'; ctx.fillRect(0, 0, W, H);
    buildParts();
  }
  addEventListener('resize', resize);
  resize();

  function frame() {
    t += 0.016;
    // surge envelope: rises fast, breathes out over ~3.5s
    if (surgeOn) { surge = Math.min(1, surge + 0.03); if (surge >= 1) surgeOn = false; }
    else surge = Math.max(0, surge - 0.005);
    const timeScale = 1 + surge * 2.1;
    const hue = baseHue() + surge * 34;
    // idle: the river performs itself
    if (performance.now() - lastAct > 26000) { surgeOn = true; lastAct = performance.now(); }
    // hold -> bloom
    if (ptr.down && !bloom && performance.now() - ptr.downT > 320 && ptr.moved < 16)
      bloom = { x: ptr.x, y: ptr.y, power: 0 };
    if (bloom) bloom.power = Math.min(1, bloom.power + 0.011);

    // trail fade — the silk memory of the canvas
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(1,3,12,0.078)';
    ctx.fillRect(0, 0, W, H);

    // deep ambient glows, very slow drift
    ctx.globalCompositeOperation = 'screen';
    const glows = [
      [0.24 + 0.05 * Math.sin(t * 0.05), 0.26 + 0.04 * Math.cos(t * 0.04), 0.55, hue - 30, 0.05],
      [0.78 + 0.05 * Math.cos(t * 0.04 + 2), 0.7 + 0.05 * Math.sin(t * 0.045), 0.5, hue + 26, 0.045],
      [0.55 + 0.06 * Math.sin(t * 0.03 + 4), 0.9, 0.44, hue + 55, 0.035]
    ];
    for (const [fx, fy, fr, hh, al] of glows) {
      const gx = fx * W, gy = fy * H, gr = fr * Math.max(W, H);
      const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, `hsla(${hh}, 85%, 55%, ${al})`); g.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = g; ctx.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
    }

    // lantern orbs (gradient only — no edges, no outlines)
    for (const o of orbs) {
      const a = fieldAngle(o.x, o.y);
      o.vx += Math.cos(a) * 0.012; o.vy += Math.sin(a) * 0.012;
      o.vx *= 0.985; o.vy *= 0.985;
      o.x += o.vx; o.y += o.vy;
      o.life -= 0.00045;
      const R1 = 120 * (0.7 + 0.3 * Math.sin(t * 1.3 + o.hue));
      let g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, R1);
      g.addColorStop(0, `hsla(${o.hue}, 95%, 78%, ${0.34 * o.life})`);
      g.addColorStop(0.35, `hsla(${o.hue}, 90%, 60%, ${0.13 * o.life})`);
      g.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = g; ctx.fillRect(o.x - R1, o.y - R1, R1 * 2, R1 * 2);
      ctx.beginPath(); ctx.arc(o.x, o.y, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${o.hue}, 100%, 88%, ${0.8 * o.life})`; ctx.fill();
    }
    orbs = orbs.filter(o => o.life > 0.05);

    // bloom (held nebula)
    if (bloom) {
      const br = 26 + bloom.power * 150;
      const g = ctx.createRadialGradient(bloom.x, bloom.y, 0, bloom.x, bloom.y, br);
      g.addColorStop(0, `hsla(${hue + 20}, 95%, 80%, ${0.16 + bloom.power * 0.3})`);
      g.addColorStop(0.5, `hsla(${hue}, 90%, 60%, ${0.08 + bloom.power * 0.14})`);
      g.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.fillStyle = g; ctx.fillRect(bloom.x - br, bloom.y - br, br * 2, br * 2);
    }

    // particles ride the field
    ctx.lineCap = 'round';
    for (const p of parts) {
      p.px = p.x; p.py = p.y;
      const a = fieldAngle(p.x, p.y);
      let vx = Math.cos(a) * p.speed * timeScale, vy = Math.sin(a) * p.speed * timeScale;
      // hand-wind
      const dx = p.x - ptr.x, dy = p.y - ptr.y, d2 = dx * dx + dy * dy;
      if (d2 < 19600 && d2 > 1) {
        const d = Math.sqrt(d2), f = 1 - d / 140;
        vx += ptr.vx * f * 0.55 + (-dy / d) * f * 0.7;
        vy += ptr.vy * f * 0.55 + (dx / d) * f * 0.7;
      }
      // lantern gravity: curve toward, then orbit
      for (const o of orbs) {
        const ox = o.x - p.x, oy = o.y - p.y, od = Math.hypot(ox, oy);
        if (od < 200 && od > 24) { const f = (1 - od / 200) * 0.14; vx += ox / od * f + (-oy / od) * f * 1.6; vy += oy / od * f + (ox / od) * f * 1.6; }
      }
      // bloom pull: gentle spiral-in
      if (bloom) {
        const bx = bloom.x - p.x, by = bloom.y - p.y, bd = Math.hypot(bx, by);
        if (bd < 260 && bd > 6) { const f = (1 - bd / 260) * bloom.power * 0.3; vx += bx / bd * f + (-by / bd) * f * 2.1; vy += by / bd * f + (bx / bd) * f * 2.1; }
      }
      p.x += vx; p.y += vy;
      p.life++;
      const fade = Math.min(1, Math.min(p.life / 30, (p.maxLife - p.life) / 30));
      const spd = Math.min(1, Math.hypot(vx, vy) / 2.6);
      ctx.strokeStyle = `hsla(${hue + p.hueJit + spd * 26 + p.y / H * 18}, 92%, ${58 + spd * 20}%, ${0.5 * fade})`;
      ctx.lineWidth = p.w;
      ctx.beginPath(); ctx.moveTo(p.px, p.py); ctx.lineTo(p.x, p.y); ctx.stroke();
      if (p.life > p.maxLife || p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) spawn(p);
    }

    // burst sparks
    for (const s of sparks) {
      const sx = s.x, sy = s.y;
      s.x += s.vx; s.y += s.vy; s.vx *= 0.97; s.vy *= 0.97; s.life -= s.decay;
      if (s.life <= 0) continue;
      ctx.strokeStyle = `hsla(${s.hue}, 95%, 76%, ${s.life * 0.85})`;
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(s.x, s.y); ctx.stroke();
    }
    sparks = sparks.filter(s => s.life > 0);

    // occasional drifting mote — a lone bright traveller
    if (Math.random() < 0.004 && !frame.mote) frame.mote = { x: -10, y: Math.random() * H * 0.7, vx: 2.2 + Math.random() * 2, vy: 0.7, life: 1 };
    if (frame.mote) {
      const m = frame.mote;
      m.x += m.vx; m.y += m.vy; m.life -= 0.004;
      const mg = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
      mg.addColorStop(0, `hsla(${hue + 30}, 100%, 85%, ${0.8 * m.life})`); mg.addColorStop(1, 'hsla(0,0%,0%,0)');
      ctx.strokeStyle = mg; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12); ctx.stroke();
      if (m.x > W + 20 || m.life <= 0) frame.mote = null;
    }

    // film grain
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.05;
    const gx = (Math.random() * 140) | 0, gy = (Math.random() * 140) | 0;
    for (let x = -gx; x < W; x += 140) for (let y = -gy; y < H; y += 140) ctx.drawImage(grain, x, y);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    if (!reduce) requestAnimationFrame(frame);
  }
  frame.mote = null;

  frame();
</script>
</body>
</html>
